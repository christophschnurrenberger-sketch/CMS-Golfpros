# ==========================================================================
# GolfPro CMS – automatischer Upload auf den Webspace
# --------------------------------------------------------------------------
# Jeder Push auf den Hauptzweig landet auf dem Server. Es wird nichts
# gebaut: Das System hat weder Composer noch Node, die Dateien im
# Repository sind bereits die Dateien, die laufen sollen.
#
# Zwei Wege, je nachdem, was der Hoster anbietet – FTP_PROTOKOLL
# entscheidet:
#
#   ftp, ftps, ftps-legacy   die FTP-Familie, per FTP-Deploy-Action
#   sftp                     Dateiuebertragung durch SSH, per lftp
#
# IONOS-Linux-Pakete zum Beispiel koennen nur SFTP; dort scheitert jeder
# FTPS-Versuch mit "500 'AUTH': command unrecognized".
#
# Zwei Dinge sind hier wichtiger als die Bequemlichkeit:
#
#   1. Vor dem Upload wird jede PHP-Datei auf Syntax geprüft. Ein Tippfehler
#      auf einem Webspace ohne Kommandozeile heißt weiße Seite für echte
#      Kunden – und die merkt man erst, wenn jemand anruft.
#
#   2. Der Abgleich fasst die Daten des Betriebs nicht an. config.php,
#      die Datenbank und der uploads-Ordner bleiben, wie sie sind. Sie
#      stehen nicht im Repository, also kann ein Abgleich sie auch nicht
#      ersetzen – die Ausschlussliste unten sagt es zusätzlich ausdrücklich.
#
# Was eingerichtet sein muss, steht in docs/DEPLOY.md.
# ==========================================================================

name: Auf den Webspace laden

on:
  push:
    # Nur der Zweig, der wirklich live geht. Wer einen main-Zweig anlegt,
    # trägt ihn hier ein und nimmt den anderen heraus.
    branches:
      - main
      - master
      - claude/fervent-knuth-cr7shs
  # Erlaubt den Start von Hand unter „Actions“ – nützlich nach einem
  # Hosterwechsel oder wenn ein Upload abgebrochen ist.
  workflow_dispatch:

# Zwei Uploads gleichzeitig würden sich auf halbem Weg ins Gehege kommen
# und die Abgleichsdatei auf dem Server verderben. Deshalb wird gewartet
# statt abgebrochen: Ein abgebrochener Upload hinterlässt halbe Dateien.
concurrency:
  group: webspace-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  pruefen:
    name: Syntax prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Geprüft wird gegen 8.1, die niedrigste unterstützte Version. Gegen
      # 8.4 zu prüfen ginge auch durch, wenn im Code etwas steht, das auf
      # einem älteren Hoster nicht läuft.
      - name: PHP 8.1 bereitstellen
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Jede PHP-Datei auf Syntax prüfen
        run: |
          fehler=0
          anzahl=0
          while IFS= read -r -d '' datei; do
            anzahl=$((anzahl + 1))
            if ! ausgabe=$(php -l "$datei" 2>&1); then
              echo "::error file=${datei#./}::$(echo "$ausgabe" | head -n 1)"
              fehler=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          echo "$anzahl PHP-Dateien geprüft."
          exit $fehler

      # Wäre eine dieser Dateien je versehentlich eingecheckt worden, würde
      # der Upload die Zugangsdaten oder die Kundendatenbank des laufenden
      # Betriebs überschreiben. Beides ist nicht rückgängig zu machen.
      - name: Keine Betriebsdaten im Repository
        run: |
          gefunden=$(git ls-files -- 'config.php' 'data/*.sqlite*' '*.env' 2>/dev/null)
          if [ -n "$gefunden" ]; then
            echo "::error::Diese Dateien gehören nicht ins Repository und würden"
            echo "::error::beim Upload die Daten auf dem Server ersetzen:"
            echo "$gefunden"
            exit 1
          fi
          echo "Keine Zugangsdaten und keine Datenbank im Repository."

  hochladen:
    name: Per FTPS übertragen
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Die Einstellungen werden hier geprueft und nicht erst von der Action.
      # Deren Meldungen sind knapp und englisch; wer zum ersten Mal einen
      # Webspace anbindet, soll lesen koennen, was gemeint ist.
      - name: Zugangsdaten und Einstellungen pruefen
        id: zugang
        env:
          SERVER:      ${{ secrets.FTP_SERVER }}
          PROTOKOLL:   ${{ vars.FTP_PROTOKOLL }}
          PORT:        ${{ vars.FTP_PORT }}
          VERZEICHNIS: ${{ vars.FTP_VERZEICHNIS }}
        run: |
          # Noch nichts hinterlegt: Das ist der Zustand direkt nach dem
          # Anlegen des Workflows und kein Fehler.
          if [ -z "$SERVER" ]; then
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
            echo "::warning::Es ist kein FTP_SERVER hinterlegt, also wird nichts hochgeladen."
            echo "::warning::Einzurichten unter Settings -> Secrets and variables -> Actions."
            echo "::warning::Welche Werte gebraucht werden, steht in docs/DEPLOY.md."
            exit 0
          fi

          # sftp ist nicht die sichere Fassung von ftp, sondern ein anderes
          # Protokoll: Dateiuebertragung durch eine SSH-Verbindung. Deshalb
          # geht es einen anderen Weg als die FTP-Familie - und deshalb ist
          # auch der uebliche Port ein anderer.
          case "${PROTOKOLL:-ftps}" in
            ftp|ftps)     weg=ftp;  standardport=21  ;;
            ftps-legacy)  weg=ftp;  standardport=990 ;;
            sftp)         weg=sftp; standardport=22  ;;
            *)
              echo "::error::FTP_PROTOKOLL kennt nur ftp, ftps, ftps-legacy und sftp."
              echo "::error::Hinterlegt ist \"$PROTOKOLL\"."
              exit 1
              ;;
          esac

          # Die Action besteht auf einem Schraegstrich am Ende und bricht
          # sonst ab. Den haengen wir lieber an, als den Lauf daran
          # scheitern zu lassen.
          ziel="${VERZEICHNIS:-./}"
          case "$ziel" in
            */) ;;
            *)  ziel="$ziel/"
                echo "::notice::FTP_VERZEICHNIS hatte keinen Schraegstrich am Ende; ergaenzt zu $ziel" ;;
          esac

          echo "bereit=ja" >> "$GITHUB_OUTPUT"
          echo "weg=$weg" >> "$GITHUB_OUTPUT"
          echo "ziel=$ziel" >> "$GITHUB_OUTPUT"
          echo "port=${PORT:-$standardport}" >> "$GITHUB_OUTPUT"
          echo "Weg: ${PROTOKOLL:-ftps} ueber Port ${PORT:-$standardport}, Zielordner $ziel"

      - name: Dateien abgleichen (FTP-Familie)
        if: steps.zugang.outputs.bereit == 'ja' && steps.zugang.outputs.weg == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_BENUTZER }}
          password:   ${{ secrets.FTP_PASSWORT }}

          # FTPS verschlüsselt die Verbindung. Einfaches „ftp“ schickt das
          # Passwort im Klartext über das Netz; das ist nur eine Notlösung
          # für Hoster, die nichts anderes können.
          protocol:   ${{ vars.FTP_PROTOKOLL || 'ftps' }}
          port:       ${{ steps.zugang.outputs.port }}
          security:   ${{ vars.FTP_SICHERHEIT || 'strict' }}

          # Zielordner, im Schritt davor um einen fehlenden Schrägstrich
          # ergänzt. Häufig: ./  oder  /httpdocs/  oder  /html/
          server-dir: ${{ steps.zugang.outputs.ziel }}

          # NIEMALS dangerous-clean-slate einschalten. Das löscht vor dem
          # Upload alles im Zielordner – also auch Datenbank und Uploads.

          # Was nicht auf den Server gehört.
          #
          # Achtung beim Ändern: Der Block unter „exclude:“ ist ein
          # wörtlicher Textblock. Eine Raute darin ist kein Kommentar,
          # sondern ein Suchmuster. Erklärungen gehören deshalb hierher.
          #
          #   .git*, .github, node_modules   Entwicklungskram. Die ersten
          #       vier Zeilen ersetzen die Voreinstellung der Action und
          #       müssen stehen bleiben, wenn jemand die Liste ergänzt.
          #   .DS_Store, Thumbs.db           Was macOS und Windows in
          #       jeden Ordner legen.
          #   config.php                     Zugangsdaten des Betriebs.
          #       Liegt ohnehin nicht im Repository; die Zeile ist die
          #       zweite Sicherung.
          #   data/*.sqlite*, data/cache     Die Datenbank mit allen
          #       Kundendaten.
          #   uploads/w*/                    Logos, Videos, Unterlagen der
          #       Kunden. uploads/.htaccess und uploads/index.html gehen
          #       weiterhin mit – sie sperren den Ordner für den Browser.
          #   install.php                    Richtet die Anlage ein und
          #       soll danach vom Server verschwinden. Ein Upload, der ihn
          #       jedes Mal zurückbringt, macht die Empfehlung wertlos.
          #       Für die erste Einrichtung siehe docs/DEPLOY.md.
          #   docs/, README.md               Interne Unterlagen gehören
          #       nicht unter die eigene Domain.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            config.php
            data/*.sqlite
            data/*.sqlite-shm
            data/*.sqlite-wal
            data/cache/**
            uploads/w*/**
            install.php
            docs/**
            README.md

      # ------------------------------------------------------------------
      # Der zweite Weg: SFTP.
      #
      # Die FTP-Deploy-Action kann kein SFTP, und es gibt keine gepflegte
      # Action, die Passwort-Anmeldung und einen echten Abgleich verbindet.
      # lftp kann beides und liegt in den Paketquellen.
      #
      # Ein Unterschied zur Action muss man kennen, sonst kostet er Daten:
      #
      #   Die Action fuehrt auf dem Server Buch und loescht nur, was sie
      #   selbst einmal hochgeladen hat. Fremde Dateien sieht sie nicht.
      #
      #   lftp vergleicht stattdessen mit dem, was wirklich im Zielordner
      #   liegt. Mit --delete raeumt es alles weg, was hier nicht mehr
      #   existiert - und wenn der Zielordner zu weit gefasst ist, eben
      #   auch die zweite Website daneben. Beim Standardziel ./ ist das
      #   das ganze Login-Verzeichnis.
      #
      # Deshalb wird hier nicht geloescht, ausser jemand schaltet es
      # ausdruecklich ein (FTP_LOESCHEN) und hat vorher im Protokoll
      # gesehen, was der Trockenlauf entfernen wuerde. Der Preis: Eine aus
      # dem Repository entfernte Datei bleibt oben liegen.
      # ------------------------------------------------------------------
      - name: lftp bereitstellen
        if: steps.zugang.outputs.bereit == 'ja' && steps.zugang.outputs.weg == 'sftp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Dateien abgleichen (SFTP)
        if: steps.zugang.outputs.bereit == 'ja' && steps.zugang.outputs.weg == 'sftp'
        env:
          SERVER:   ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_BENUTZER }}
          PASSWORT: ${{ secrets.FTP_PASSWORT }}
          PORT:     ${{ steps.zugang.outputs.port }}
          ZIEL:     ${{ steps.zugang.outputs.ziel }}
          LOESCHEN: ${{ vars.FTP_LOESCHEN }}
        run: |
          set -u

          # Das Passwort geht ueber eine .netrc, nicht ueber die
          # Befehlszeile. Sonst stuende es in der Prozessliste, und ein
          # Anfuehrungszeichen oder Semikolon darin wuerde das lftp-Skript
          # zerlegen - im schlimmsten Fall mit einem fremden Befehl darin.
          heim=$(mktemp -d)
          trap 'rm -rf "$heim"' EXIT
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$SERVER" "$BENUTZER" "$PASSWORT" > "$heim/.netrc"
          chmod 600 "$heim/.netrc"

          # Dieselben Regeln wie in der exclude-Liste der Action, nur in
          # lftps Schreibweise: regulaere Ausdruecke auf den Pfad, nicht
          # Glob-Muster. WER HIER ETWAS AENDERT, AENDERT ES AUCH OBEN.
          #
          #   ^\.git        .gitignore und das Verzeichnis selbst
          #   ^config\.php  Zugangsdaten des Betriebs
          #   ^data/.*sqlite, ^data/cache/   die Datenbank
          #   ^uploads/w    Logos, Videos, Unterlagen der Kunden
          #   ^install\.php der Installer
          #   ^docs/, ^README\.md            interne Unterlagen
          aus="--exclude ^\.git"
          aus="$aus --exclude ^\.github/"
          aus="$aus --exclude ^config\.php$"
          aus="$aus --exclude ^data/.*\.sqlite"
          aus="$aus --exclude ^data/cache/"
          aus="$aus --exclude ^uploads/w"
          aus="$aus --exclude ^install\.php$"
          aus="$aus --exclude ^docs/"
          aus="$aus --exclude ^README\.md$"

          # Aufraeumen ist Absicht, nicht Voreinstellung.
          loeschen=""
          if [ "${LOESCHEN:-}" = "ja" ]; then
            if [ "$ZIEL" = "./" ]; then
              echo "::error::FTP_LOESCHEN=ja zusammen mit dem Standardziel ./ ist zu"
              echo "::error::gefaehrlich: ./ ist das ganze Login-Verzeichnis, und dort"
              echo "::error::liegt bei vielen Hostern mehr als diese eine Website."
              echo "::error::Erst FTP_VERZEICHNIS auf den Ordner der Anlage setzen."
              exit 1
            fi
            loeschen="--delete"
            echo "::warning::FTP_LOESCHEN ist eingeschaltet. Alles im Zielordner, was"
            echo "::warning::nicht im Repository steht, wird entfernt - ausgenommen ist"
            echo "::warning::nur, was in der Liste unten steht."
          else
            echo "::notice::Es wird nichts geloescht. Eine aus dem Repository entfernte"
            echo "::notice::Datei bleibt auf dem Server liegen. Zum Aufraeumen die"
            echo "::notice::Variable FTP_LOESCHEN auf ja setzen - vorher aber den"
            echo "::notice::Trockenlauf unten lesen."
          fi

          # Dieselben Einstellungen fuer beide Laeufe, damit der Trockenlauf
          # nicht etwas anderes zeigt, als danach geschieht.
          opt="--reverse --only-newer --no-perms $loeschen $aus"

          verbindung="
            set sftp:auto-confirm yes;
            set cmd:interactive false;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$BENUTZER\" sftp://$SERVER:$PORT;
          "

          # Erst ein Trockenlauf ins Protokoll. Wer spaeter wissen will, was
          # ein Lauf angefasst hat, findet es hier - und zwar bevor es
          # geschehen ist.
          echo "── Was sich aendern wird ──────────────────────────────"
          HOME="$heim" lftp -c "$verbindung mirror $opt --dry-run --verbose=2 ./ \"$ZIEL\";"

          echo "── Uebertragung ───────────────────────────────────────"
          HOME="$heim" lftp -c "$verbindung mirror $opt --parallel=2 --verbose=1 ./ \"$ZIEL\";"

      # Ein erfolgreicher Upload heißt noch nicht, dass die Seite läuft.
      # Diese Prüfung ist absichtlich einfach: Sie ruft die Startseite auf
      # und schaut, ob der Server überhaupt antwortet.
      - name: Nachsehen, ob die Seite antwortet
        if: steps.zugang.outputs.bereit == 'ja' && vars.SEITEN_URL != ''
        # Die Adresse kommt über die Umgebung in das Skript, nicht per
        # Textersetzung hinein. Sonst würde ein Anführungszeichen im Wert
        # die Zeile zerlegen und der Rest liefe als Befehl.
        env:
          SEITEN_URL: ${{ vars.SEITEN_URL }}
        run: |
          url="$SEITEN_URL"
          for versuch in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -L "$url" || echo 000)
            echo "Versuch $versuch: HTTP $code"
            case "$code" in
              200|301|302) echo "::notice::$url antwortet mit $code."; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::$url antwortet nicht wie erwartet (zuletzt HTTP $code)."
          echo "::error::Die Dateien sind oben, aber die Seite läuft nicht."
          exit 1

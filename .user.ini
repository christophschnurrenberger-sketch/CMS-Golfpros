; ==========================================================================
; PHP-Grenzen fuer Hoster, die PHP als FastCGI oder FPM betreiben
; --------------------------------------------------------------------------
; Der <IfModule mod_php.c>-Block in der .htaccess greift dort nicht: Es gibt
; kein mod_php, also wird er stillschweigend uebersprungen, und es bleibt
; bei den Voreinstellungen des Hosters. Bei IONOS, All-Inkl und den meisten
; anderen ist das der Fall - dort liest PHP stattdessen diese Datei.
;
; Warum es ueberhaupt Raum braucht: Ein Foto aus einer Handykamera hat
; gerne 5 bis 12 MB, ein Schwungvideo deutlich mehr. Ist post_max_size zu
; klein, wirft PHP den ganzen Vorgang weg, noch bevor eine Zeile dieser
; Anwendung laeuft - samt Sicherheitsmerkmal des Formulars.
;
; Manche Hoster erlauben diese Datei nicht oder nur einen Teil davon. Dann
; bleibt der Kundenbereich des Hosters oder eine Nachfrage beim Support.
; Was wirklich gilt, steht in systemcheck.php.
; ==========================================================================

upload_max_filesize = 64M
post_max_size = 68M
memory_limit = 128M
max_execution_time = 120
max_input_time = 120
